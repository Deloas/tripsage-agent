[project]
name = "tripsage-agent-backend"
version = "0.1.0"
description = "行迹智策 TripSage Agent 后端服务"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.0",
  "httpx>=0.27.0",
  "pillow>=10.3.0",
  "python-dotenv>=1.0.0",
  "rapidocr-onnxruntime>=1.3.24; python_version < '3.13'",
  "loguru>=0.7.2",
  "langgraph>=0.2.0",
  "langchain>=0.2.0",
  "langchain-openai>=0.1.0",
  "langchain-mcp-adapters>=0.1.0",
  "mcp>=1.0.0",
  "mcp-server-12306>=0.3.1",
  "chromadb>=0.5.0",
  "playwright>=1.52.0,<1.53.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "black>=24.4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
